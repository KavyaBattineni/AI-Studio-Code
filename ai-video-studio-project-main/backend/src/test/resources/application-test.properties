spring.datasource.url=jdbc:h2:mem:aivideo_test_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

app.mode=mock
app.jwt.secret=test-only-secret-key-at-least-32-bytes-long-for-hs256-signing
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.cors.allowed-origin=http://localhost:5173
app.rate-limit.enabled=false

app.otp.length=6
app.otp.validity-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

app.diamonds.video-4s-cost=5
app.diamonds.video-8s-cost=10
app.diamonds.daily-reward-amount=3

logging.level.com.aivideo.platform=INFO
logging.level.org.hibernate.SQL=WARN
