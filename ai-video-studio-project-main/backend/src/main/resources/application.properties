# =========================================================================
# AI Video Studio - Base configuration (shared by all profiles)
# Values come from environment variables (see .env.example at the repo root).
# Sensible local defaults are provided after the ":" so the app can start
# without a .env file, but you should never rely on those defaults in prod.
# =========================================================================

spring.application.name=ai-video-studio

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Server ----------
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ---------- Datasource ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aivideo_studio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=AiVideoStudioHikariPool

# ---------- JPA / Hibernate ----------
# Flyway owns the schema. Hibernate only validates that entities match it -
# this catches entity/schema drift at startup instead of silently auto-altering tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------- Application mode ----------
# mock  -> all external providers (email/payment/video/moderation/ads/storage) use
#          the Mock* implementations, so the whole app runs with no external accounts.
# live  -> providers should be wired to real credentials (see the provider interfaces).
app.mode=${APP_MODE:mock}

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-deployment-32chars}
app.jwt.access-token-expiration-ms=${JWT_EXPIRATION:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ---------- CORS ----------
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# ---------- Mail (used only when app.mode=live) ----------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@aivideostudio.local}

# ---------- External providers (read by the provider implementations) ----------
app.providers.ai-video.api-key=${AI_VIDEO_API_KEY:}
app.providers.payment.key=${PAYMENT_KEY:}
app.providers.payment.secret=${PAYMENT_SECRET:}
app.providers.storage.bucket=${STORAGE_BUCKET:}
app.providers.storage.access-key=${STORAGE_ACCESS_KEY:}
app.providers.storage.secret-key=${STORAGE_SECRET_KEY:}
app.providers.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:https://mock-storage.aivideostudio.local}
app.providers.ads.provider-key=${AD_PROVIDER_KEY:}

# ---------- Business rules ----------
app.diamonds.video-4s-cost=5
app.diamonds.video-8s-cost=10
app.diamonds.daily-reward-amount=3

# ---------- OTP ----------
app.otp.length=6
app.otp.validity-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ---------- Rate limiting (simple in-memory limiter; see RateLimitingFilter) ----------
app.rate-limit.enabled=true

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Multipart (headroom for future image-to-video uploads) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.aivideo.platform=INFO
logging.level.org.hibernate.SQL=WARN
