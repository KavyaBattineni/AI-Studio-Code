# =========================================================================
# Production profile
#
# Before deploying to production:
#   1. Set APP_MODE=live and provide real credentials for every provider you
#      intend to use (payment, AI video, storage, ads, SMTP). Any provider left
#      unconfigured should be explicitly disabled rather than left on Mock.
#   2. Generate a strong JWT_SECRET (e.g. `openssl rand -base64 48`) and inject
#      it via your deployment platform's secret manager, never via source control.
#   3. Put the API behind HTTPS (terminate TLS at your load balancer / nginx /
#      cloud provider - Spring Boot itself is not configured to terminate TLS here).
#   4. Replace the in-memory RateLimitingFilter with a distributed limiter
#      (Bucket4j + Redis is a common choice) if you run more than one instance.
#   5. Point FRONTEND_URL at your real deployed frontend origin (CORS).
# =========================================================================

logging.level.com.aivideo.platform=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

server.error.include-stacktrace=never
